# Pre-built static site — no build step on Netlify.

[build]
  publish = "."

[[redirects]]
  from = "/projects/:slug"
  to = "/projects/:slug/"
  status = 301

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
